<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Naslov i Meta tagovi za Instagram / Facebook / WhatsApp deljenje -->
    <title>IZBORI 2D26</title>
    <meta property="og:title" content="IZBORI 2D26">
    <meta property="og:description" content="16-bitna retro arkadna igrica - Izbori 2026!">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="IZBORI 2D26">
    <meta name="twitter:description" content="16-bitna retro arkadna igrica - Izbori 2026!">

    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            background-image: url('bg-desktop.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        /* Prilagođeno platno igre sa lepim retro okvirom */
        canvas {
            width: auto !important;
            height: auto !important;
            max-width: 92vw !important;
            max-height: 88vh !important;
            aspect-ratio: 400 / 700 !important;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.5);
            border: 4px solid #2d2218;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>

    <script>
        kaboom({
            width: 400,
            height: 700,
            letterbox: false,
            background: [35, 39, 42]
        });

        // Helper funkcija za tekst sa jakom crnom ivicom u 8 pravaca (Retro Arcade stil)
        function napraviTekstSaIvicom(txt, x, y, size = 20, mainColor = rgb(255, 220, 0), align = "center") {
            const parent = add([
                pos(x, y),
                z(500)
            ]);

            const offsets = [
                [-2, -2], [2, -2], [-2, 2], [2, 2],
                [-2, 0], [2, 0], [0, -2], [0, 2]
            ];

            const bgTexts = offsets.map(([ox, oy]) => {
                return parent.add([
                    text(txt, { size: size }),
                    pos(ox, oy),
                    anchor(align),
                    color(0, 0, 0)
                ]);
            });

            const mainText = parent.add([
                text(txt, { size: size }),
                pos(0, 0),
                anchor(align),
                color(mainColor)
            ]);

            return {
                set text(val) {
                    mainText.text = val;
                    bgTexts.forEach(t => t.text = val);
                },
                get text() {
                    return mainText.text;
                }
            };
        }

        // 0. UČITAVANJE SPRITOVA I ZVUKA
        loadSprite("vucic", "vucic.png");
        loadSprite("dacic", "dacic.png");
        loadSprite("ilija", "ilija.png");
        loadSprite("novac", "money.png");
        loadSprite("indeks", "index.png");
        loadSprite("trava", "bg.jpeg");
        loadSound("bgm", "bgm.mp3");
        loadSound("cashin", "cashin.mp3");

        let bgmMusic = null;
        let isMuted = false;

        // Pokretanje muzike ispočetka
        function startujMuziku() {
            if (!bgmMusic) {
                try {
                    bgmMusic = play("bgm", {
                        loop: true,
                        volume: isMuted ? 0 : 0.28
                    });
                } catch (e) {
                    console.log("Autoplay sačekao dodir igrača.");
                }
            }
        }

        // Potpuno zaustavljanje muzike
        function zaustaviMuziku() {
            if (bgmMusic) {
                bgmMusic.stop();
                bgmMusic = null;
            }
        }

        // Mute / Unmute dugme u uglu ekrana
        function dodajMuteDugme() {
            const btn = add([
                text(isMuted ? "🔇" : "🔊", { size: 20 }),
                pos(365, 25),
                anchor("center"),
                area({ scale: vec2(1.5, 1.5) }),
                fixed(),
                z(1000),
                "muteBtn"
            ]);

            btn.onClick(() => {
                isMuted = !isMuted;
                if (bgmMusic) {
                    bgmMusic.volume = isMuted ? 0 : 0.28;
                }
                btn.text = isMuted ? "🔇" : "🔊";
            });
        }

        // Skrolujuća pozadina sa fiksiranim dimenzijama
        function dodajSkrolujucuPozadinu(brzina = 200) {
            const bg1 = add([
                sprite("trava", { width: 400, height: 700 }),
                pos(0, 0),
                z(-100)
            ]);

            const bg2 = add([
                sprite("trava", { width: 400, height: 700 }),
                pos(0, -700),
                z(-100)
            ]);

            add([rect(4, 700), pos(0, 0), color(20, 24, 18), z(-90)]);
            add([rect(4, 700), pos(396, 0), color(20, 24, 18), z(-90)]);

            let bgY = 0;

            onUpdate(() => {
                bgY = (bgY + brzina * dt()) % 700;
                bg1.pos.y = bgY;
                bg2.pos.y = bgY - 700;
            });
        }

        // Statična pozadina za meni i gameover
        function drawStaticnuPozadinu() {
            add([
                sprite("trava", { width: 400, height: 700 }),
                pos(0, 0),
                z(-100)
            ]);
            add([rect(4, 700), pos(0, 0), color(20, 24, 18), z(-90)]);
            add([rect(4, 700), pos(396, 0), color(20, 24, 18), z(-90)]);
        }

        // 1. IZBOR LIKA
        scene("select", () => {
            drawStaticnuPozadinu();
            dodajMuteDugme();

            napraviTekstSaIvicom("IZABERI HEROJA", 200, 90, 26, rgb(255, 220, 0));

            // 1. ALEK (Vučić)
            add([
                sprite("vucic"),
                scale(1.1),
                pos(75, 270),
                area(),
                anchor("center"),
                "p1"
            ]);
            napraviTekstSaIvicom("ALEK", 75, 370, 16, rgb(255, 255, 255));

            // 2. IVCA (Dačić)
            add([
                sprite("dacic"),
                scale(1.1),
                pos(200, 270),
                area(),
                anchor("center"),
                "p2"
            ]);
            napraviTekstSaIvicom("IVCA", 200, 370, 16, rgb(255, 255, 255));

            // 3. ILIJA (Srdanović)
            add([
                sprite("ilija"),
                scale(1.1),
                pos(325, 270),
                area(),
                anchor("center"),
                "p3"
            ]);
            napraviTekstSaIvicom("ILIJA", 325, 370, 16, rgb(255, 255, 255));

            napraviTekstSaIvicom("Dodirni lika za start", 200, 480, 16, rgb(255, 220, 0));

            onClick("p1", () => { zaustaviMuziku(); startujMuziku(); go("game", { charSprite: "vucic" }); });
            onClick("p2", () => { zaustaviMuziku(); startujMuziku(); go("game", { charSprite: "dacic" }); });
            onClick("p3", () => { zaustaviMuziku(); startujMuziku(); go("game", { charSprite: "ilija" }); });
        });

        // 2. SCENA IGRE
        scene("game", ({ charSprite }) => {
            dodajSkrolujucuPozadinu(200);
            dodajMuteDugme();

            let score = 0;

            const scoreLabel = napraviTekstSaIvicom("POENI: 0", 20, 20, 22, rgb(255, 220, 0), "topleft");

            // Igrač
            const player = add([
                sprite(charSprite || "vucic"),
                scale(0.75),
                pos(200, 600),
                area({
                    scale: vec2(0.35, 0.75),
                    offset: vec2(0, 5)
                }),
                anchor("center"),
                "player"
            ]);

            // Kontrole tastatura
            onKeyDown("left", () => {
                player.pos.x = Math.max(35, player.pos.x - 500 * dt());
            });

            onKeyDown("right", () => {
                player.pos.x = Math.min(365, player.pos.x + 500 * dt());
            });

            // Kontrole dodir / miš
            onUpdate(() => {
                if (isMouseDown()) {
                    player.pos.x = clamp(mousePos().x, 35, 365);
                }
            });

            // Prepreke
            loop(0.55, () => {
                const baseSpeed = Math.min(520, 230 + (score * 1.6));

                const tip = choose([
                    { col: [255, 200, 0], w: rand(55, 75), speedMult: 1.0 },
                    { col: [255, 120, 0], w: rand(45, 65), speedMult: 1.15 },
                    { col: [255, 50, 50],  w: rand(70, 90), speedMult: 0.95 }
                ]);

                add([
                    rect(tip.w, 20),
                    pos(rand(50, 350), -20),
                    color(...tip.col),
                    area({ scale: vec2(0.9, 0.8) }),
                    anchor("center"),
                    move(DOWN, baseSpeed * tip.speedMult),
                    "obstacle"
                ]);
            });

            // Bonus predmet (+25 poena): Indeks za Iliju, Novac za Aleksa i Ivcu
            loop(2.8, () => {
                const bonusSpeed = Math.min(500, 250 + (score * 1.4));
                const bonusSprite = (charSprite === "ilija") ? "indeks" : "novac";
                const bonusScale = (charSprite === "ilija") ? 0.12 : 0.15;

                add([
                    sprite(bonusSprite),
                    scale(bonusScale),
                    pos(rand(50, 350), -20),
                    area(),
                    anchor("center"),
                    move(DOWN, bonusSpeed),
                    "bonus"
                ]);
            });

            // Kazneni predmet (-20 poena): Samo za Aleksa i Ivcu
            if (charSprite !== "ilija") {
                loop(3.4, () => {
                    const penaltySpeed = Math.min(500, 240 + (score * 1.4));
                    add([
                        sprite("indeks"),
                        scale(0.12),
                        pos(rand(50, 350), -20),
                        area(),
                        anchor("center"),
                        move(DOWN, penaltySpeed),
                        "penalty"
                    ]);
                });

                player.onCollide("penalty", (p) => {
                    destroy(p);
                    score = Math.max(0, score - 20);
                    scoreLabel.text = "POENI: " + score;
                });
            }

            // Brojač poena
            loop(0.15, () => {
                score += 1;
                scoreLabel.text = "POENI: " + score;
            });

            // Skupljanje bonusa
            player.onCollide("bonus", (b) => {
                destroy(b);
                score += 25;
                scoreLabel.text = "POENI: " + score;

                if (charSprite !== "ilija") {
                    play("cashin", { volume: isMuted ? 0 : 0.18 });
                }
            });

            // Game over
            player.onCollide("obstacle", () => {
                zaustaviMuziku();
                go("gameover", { score });
            });
        });

        // 3. GAME OVER EKRAN
        scene("gameover", ({ score }) => {
            drawStaticnuPozadinu();
            dodajMuteDugme();

            napraviTekstSaIvicom("KRAJ IGRE!", 200, 250, 32, rgb(255, 60, 60));
            napraviTekstSaIvicom(`POENI: ${score}`, 200, 320, 24, rgb(255, 220, 0));
            napraviTekstSaIvicom("DODIRNI ZA RESTART", 200, 420, 16, rgb(255, 255, 255));

            onClick(() => go("select"));
        });

        go("select");
    </script>
</body>
</html>
